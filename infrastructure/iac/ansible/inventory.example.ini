# Copy to inventory.ini and fill in. One host is the usual case; the single-hostname
# topology install.sh uses puts the API, the dashboard and nginx on one machine.
[knight]
knight-1 ansible_host=203.0.113.10 ansible_user=root

[knight:vars]
knight_domain=knight.example.com
knight_acme_email=ops@example.com
# Secrets belong in a vault, not here:
#   ansible-vault create group_vars/knight/vault.yml
# with knight_db_password, knight_jwt_signing_key and knight_first_admin_password.
