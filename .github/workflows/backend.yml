name: Backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret is just as compromised when it is only in an
      # earlier commit of the branch as when it is in the tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The official action refuses to run on an organisation repository without
      # a paid licence key, so the scanner itself is used directly. It is the
      # same tool and the same configuration, and nothing here needs a secret.
      - name: Install gitleaks
        run: |
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for committed secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/Knight.slnx

      - name: Build
        run: dotnet build backend/Knight.slnx --configuration Release --no-restore

      - name: Test
        # Docker is available on this runner, so the PostgreSQL-backed suites
        # are mandatory here: a silently skipped isolation suite must never be
        # mistaken for a passing one (docs/adr/0005).
        env:
          REQUIRE_POSTGRES_TESTS: '1'
        run: dotnet test backend/Knight.slnx --configuration Release --no-build --verbosity normal
