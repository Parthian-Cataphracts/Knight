name: Backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret is just as compromised when it is only in an
      # earlier commit of the branch as when it is in the tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The official action refuses to run on an organisation repository without
      # a paid licence key, so the scanner itself is used directly. It is the
      # same tool and the same configuration, and nothing here needs a secret.
      - name: Install gitleaks
        run: |
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for committed secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/Knight.slnx

      - name: Build
        run: dotnet build backend/Knight.slnx --configuration Release --no-restore

      - name: Test
        # Docker is available on this runner, so the PostgreSQL-backed suites
        # are mandatory here: a silently skipped isolation suite must never be
        # mistaken for a passing one (docs/adr/0005).
        env:
          REQUIRE_POSTGRES_TESTS: '1'
        run: dotnet test backend/Knight.slnx --configuration Release --no-build --verbosity normal

  lint:
    name: Format and dependency audit
    runs-on: ubuntu-latest

    # The stages docs/deployment.md section 8 calls "lint" and "security".
    # Deliberately a separate job from build-and-test: a formatting slip and a
    # failing test are different problems for different people, and finding out
    # about both in one red X costs a round trip.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # --verify-no-changes rather than a reformat-and-commit: CI reports, it
      # does not rewrite the branch under the author.
      - name: Formatting
        run: dotnet format backend/Knight.slnx --verify-no-changes --verbosity minimal

      # A known-vulnerable transitive package is the supply-chain risk this
      # project is least able to see by reading its own code. --include-transitive
      # because the dangerous one is almost never the one in the csproj.
      - name: Audit NuGet dependencies
        run: |
          dotnet restore backend/Knight.slnx
          report=$(dotnet list backend/Knight.slnx package --vulnerable --include-transitive)
          echo "$report"

          if echo "$report" | grep -qi "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages found. See the report above." >&2
            exit 1
          fi

          echo "No vulnerable NuGet packages."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/knight-dashboard/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend/knight-dashboard
        # High and critical only. A moderate advisory in a build-time dependency
        # is worth knowing about and is not worth blocking a release over, and a
        # gate that cries wolf gets switched off.
        #
        # `npm audit` exits non-zero both for a real advisory and for a registry
        # that would not answer, and the two are not the same problem: the first
        # is ours to fix, the second is npmjs.org having a bad day. This retries a
        # transient registry error a few times and, if the registry stays
        # unreachable, warns and passes rather than failing a release on npm's
        # uptime — a real high/critical advisory still fails on the first attempt.
        run: |
          npm ci
          attempt=1
          max=5
          while true; do
            out=$(npm audit --audit-level=high 2>&1) && { echo "$out"; break; }
            echo "$out"
            if echo "$out" | grep -qiE "audit endpoint returned an error|Service Unavailable|ETIMEDOUT|ENETUNREACH|ECONNRESET|network timeout|50[0-9]|429"; then
              if [ "$attempt" -ge "$max" ]; then
                echo "::warning::npm audit could not reach the registry after ${max} attempts; passing without an audit result."
                break
              fi
              echo "Transient registry error (attempt ${attempt}/${max}); retrying in $((attempt * 15))s…"
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
              continue
            fi
            echo "::error::npm audit found a high or critical advisory. See the report above." >&2
            exit 1
          done

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest

    # install.sh and knightctl.sh put a whole deployment on a server, and a
    # quoting slip in either is discovered by an operator halfway through an
    # install. shellcheck catches the class of mistake that a syntax check does
    # not: an unquoted expansion, a masked exit status, a variable read before
    # it is set.
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck -S warning install.sh install-agent.sh install-store.sh knightctl.sh infrastructure/scripts/*.sh

      # A script that does not parse cannot be tested by anything downstream,
      # and bash catches things shellcheck deliberately does not.
      - name: Parse
        run: |
          for script in install.sh install-agent.sh install-store.sh knightctl.sh infrastructure/scripts/*.sh; do
            bash -n "$script"
            echo "ok  $script"
          done

  feature-packages:
    name: Feature packages
    runs-on: ubuntu-latest

    # The feature publish pipeline of docs/deployment.md section 8, as far as CI
    # can honestly take it: build every Feature package and validate its
    # manifest. Signing needs the signing key and publishing needs a live KNIGHT
    # to register the version against, so neither belongs in a pull-request run
    # (risks.md R21).
    #
    # Building here matters because the manifest is validated *before* anything
    # is built. A Feature whose manifest is malformed fails at the top of this
    # job rather than at the end of a release.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Before anything is built, because the reader that parses these manifests
      # is the one thing here with no test of its own and it has been wrong
      # twice - both times only on a runner, because PyYAML is installed on
      # every developer's machine and never on this one. The failure it produces
      # is a job that stops at the first manifest with a prose comment in it.
      # PyYAML is installed *for this check only*, and that is the whole point.
      # The selftest always parses with the fallback reader; PyYAML is the
      # reference it gets compared against. Without it the check degrades to
      # "did it raise", and a reader that silently misreads a value does not
      # raise — which is how the same reader was wrong a third time, truncating
      # every `module#export` callable at the `#`.
      #
      # Nothing else here depends on PyYAML and nothing should: the fallback is
      # the code that runs in a clean checkout, which is why it is the code
      # under test rather than the code being replaced.
      - name: Check this tool can read every manifest
        run: |
          pip install pyyaml
          python features/tools/knight_package.py selftest

      - name: Build and validate every Feature package
        run: |
          set -euo pipefail
          built=0

          for feature in features/knight-feature-*; do
            [ -f "$feature/knight_manifest.yaml" ] || continue
            echo "--- $feature"
            python features/tools/knight_package.py build "$feature" --dist "$RUNNER_TEMP/packages"
            built=$((built + 1))
          done

          # A loop that silently matched nothing would report success for having
          # packaged no features at all.
          if [ "$built" -eq 0 ]; then
            echo "::error::No feature packages were built. The glob matched nothing." >&2
            exit 1
          fi

          echo "$built feature package(s) built."

  restore-drill:
    name: Migrations and restore drill
    runs-on: ubuntu-latest

    # A backup nobody has restored is not a backup, and a restore drill nobody
    # runs is not a drill. Running it on every push is the only version of this
    # that stays true: the scripts, the schema and the dump format all change,
    # and each of them can break a restore without breaking anything else.
    # This is the release blocker recorded as question 13 in docs/risks.md.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: knight
          POSTGRES_PASSWORD: knight
          POSTGRES_DB: knight
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Migration validation, the stage docs/deployment.md section 8 calls for:
      # the migrations must apply to an empty database, not merely to whichever
      # database a developer happens to have. Seeding runs too, so the drill
      # below compares a database with real rows in it.
      - name: Apply migrations to a fresh database
        env:
          CONTROL_PLANE_DB_CONNECTION_STRING: 'Host=localhost;Port=5432;Database=knight;Username=knight;Password=knight'
        run: dotnet run --project backend/tools/Knight.Bootstrap -- --migrate-only

      # Run twice on purpose: the second run must be a no-op. A deploy applies
      # this on every release and most releases have no new migration, so a
      # seeder that is not idempotent would corrupt data on an ordinary deploy.
      - name: Apply them again, to prove it is idempotent
        env:
          CONTROL_PLANE_DB_CONNECTION_STRING: 'Host=localhost;Port=5432;Database=knight;Username=knight;Password=knight'
        run: dotnet run --project backend/tools/Knight.Bootstrap -- --migrate-only

      - name: Install PostgreSQL client tools
        # Version-matched to the server. pg_dump refuses to dump a server newer
        # than itself, and the runner's stock client is older than 17.
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Restore drill
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: knight
          PGPASSWORD: knight
          KNIGHT_DB: knight
          KNIGHT_DRILL_DB: knight_drill
          KNIGHT_BACKUP_DIR: ${{ runner.temp }}/backups
        run: infrastructure/scripts/restore-drill.sh

      # Proves the checksum guard actually guards. A corrupt dump that restores
      # anyway is the failure mode the manifest exists to prevent, so the
      # negative case is worth a test of its own.
      - name: A corrupted dump must be refused
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: knight
          PGPASSWORD: knight
        run: |
          dump="$(ls -1t "${{ runner.temp }}"/backups/*.dump | head -n 1)"
          printf 'corruption' >> "$dump"

          if infrastructure/scripts/knight-restore.sh "$dump" knight_corrupt_drill --force; then
            echo "The restore accepted a dump whose checksum does not match. That is the bug." >&2
            exit 1
          fi

          echo "Refused, as it should."

