name: Store

# The reference store and the dashboard.
#
# Phase 8 moved the business domains out of the .NET solution and into Django,
# which made this suite the only thing standing behind catalogue, orders,
# fulfilment, payments, promotions, notifications and every optional Feature.
# Leaving it out of CI would have meant the backend workflow going green while
# the code that actually runs a shop was never compiled, let alone tested.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reference-store:
    name: Reference store
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: knight
          POSTGRES_PASSWORD: knight
          POSTGRES_DB: refstore
        ports: ['5433:5432']
        # Without the health check the first migration can race the server's
        # own startup and fail for a reason that has nothing to do with the code.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stores/reference-store/requirements-dev.txt

      - name: Install dependencies
        working-directory: stores/reference-store
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Installed the way a store installs them, so the packaging is exercised
      # rather than assumed: a Feature that cannot be installed is a Feature that
      # does not work, however well its own tests pass.
      #
      # Globbed rather than listed. A named list went stale twice - once when a
      # Feature was withdrawn and once when three were added - and the second
      # time it took CI down, because REQUIRE_FEATURE_TESTS turns an
      # uninstalled Feature into a hard failure rather than a skip. The glob
      # cannot drift.
      - name: Install every Feature package
        run: |
          set -euo pipefail

          # Only the ones pip can install. Since adr/0032 a Feature may be built
          # for another runtime - `node-conformance` is - and a directory with no
          # pyproject.toml is not a Python distribution. Tested for rather than
          # named, for the same reason the glob is a glob: an exception list goes
          # stale the first time somebody adds a second node Feature.
          packages=()

          for feature in features/knight-feature-*/; do
            if [ -f "$feature/pyproject.toml" ]; then
              packages+=("$feature")
            else
              echo "  skipping $feature (not a Python distribution)"
            fi
          done

          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No installable Feature packages found. The glob matched nothing." >&2
            exit 1
          fi

          echo "Installing ${#packages[@]} package(s):"
          printf '  %s\n' "${packages[@]}"
          pip install "${packages[@]}"

      # Installing the packages is not the same as installing the Features.
      # Until the store's feature registry lists them they are not in
      # INSTALLED_APPS, their models cannot be used, and every test that touches
      # them skips — which is a green run over code nothing executed.
      - name: Register the Features with the store
        working-directory: stores/reference-store
        env:
          KNIGHT_FEATURE_ROOT: ${{ github.workspace }}/stores/knight-features
        run: |
          set -euo pipefail
          python manage.py knight_install_local ../../features/knight-feature-*/

      - name: Test
        working-directory: stores/reference-store
        env:
          STORE_DB_HOST: localhost
          STORE_DB_PORT: '5433'
          KNIGHT_FEATURE_ROOT: ${{ github.workspace }}/stores/knight-features
          # Turns a skipped Feature suite into a failure here. See above.
          REQUIRE_FEATURE_TESTS: '1'
        run: python manage.py test

  node-store:
    name: Node reference store
    runs-on: ubuntu-latest

    # The store that makes `node` a runtime rather than a name in a validator
    # (docs/adr/0032-a-feature-declares-its-runtime.md section 4). Its suite
    # builds the real artifact with the real packaging tool and installs it, so a
    # change that breaks runtime-neutral delivery fails here rather than being
    # discovered by whoever tries it first.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The suite shells out to the packaging tool, which needs nothing else.
      - name: Take delivery of a Feature
        working-directory: stores/node-reference-store
        run: npm test

  contract:
    name: Contract conformance
    runs-on: ubuntu-latest

    # The checker a new store integration is finished against, checked against
    # the contract it claims to describe. It needs nothing running, and it is a
    # job of its own because a checker that has drifted would otherwise report
    # confident, wrong verdicts about somebody else's store.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reproduce the contract's signed strings
        run: python stores/conformance/knight_conformance.py selftest

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/knight-dashboard/package-lock.json

      - name: Install
        working-directory: frontend/knight-dashboard
        run: npm ci

      # Type checking is separate from the tests on purpose. Most of the
      # frontend defects this project has hit were contract mismatches — a field
      # the API renamed, a value that turned out to be nullable — and those show
      # up here, not in a component test.
      - name: Type check
        working-directory: frontend/knight-dashboard
        run: npx tsc --noEmit

      - name: Test
        working-directory: frontend/knight-dashboard
        run: npx vitest run

      - name: Build
        working-directory: frontend/knight-dashboard
        run: npm run build
