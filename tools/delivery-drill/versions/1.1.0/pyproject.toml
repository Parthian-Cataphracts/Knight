[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knight-feature-drill"
version = "1.1.0"
description = "The Feature the delivery drill installs, upgrades and rolls back. Not for sale."
requires-python = ">=3.12"
dependencies = ["Django>=5.0,<6.0"]

[tool.setuptools]
packages = ["knight_feature_drill", "knight_feature_drill.migrations"]
