# The contract between this Feature and everything that handles it: KNIGHT
# validates it at publish, the resolver reads its dependencies, and the store's
# installer reads its install and migration declarations
# (docs/feature-delivery.md section 5).
apiVersion: knight.dev/v1
slug: knight-feature-delivery
version: 1.0.0
name: Delivery Zones
description: >-
  Named delivery areas, a fee for each, and a minimum order per area.
  Collection-only is a complete business, so this is a Feature rather than part
  of the base image (docs/adr/0024-base-store-versus-optional-feature.md).

django:
  app_label: knight_delivery
  installed_app: knight_feature_delivery

compatibility:
  # Needs a store new enough to carry the order fulfilment snapshot, which is
  # what keeps a delivered order explicable after this feature is uninstalled.
  storeVersion: ">=2.0.0"
  python: ">=3.12"
  django: ">=5.0,<6.0"

migrations:
  required: true
  reversible: true
  estimatedDurationSeconds: 5
  requiresMaintenanceWindow: false

install:
  strategy: package-install
  requiresRestart: true
  healthCheck: knight_feature_delivery.checks.health

uninstall:
  strategy: disable-then-remove
  dataRetentionDays: 30
