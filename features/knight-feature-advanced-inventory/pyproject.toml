[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knight-feature-advanced-inventory"
version = "1.0.0"
description = "Stock movements, reservations, suppliers and purchase orders for a KNIGHT store."
requires-python = ">=3.12"
dependencies = ["Django>=5.0,<6.0"]

[tool.setuptools]
packages = ["knight_feature_advanced_inventory", "knight_feature_advanced_inventory.migrations"]
