[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knight-feature-loyalty-rewards"
version = "1.1.0"
description = "Points, tiers and a loyalty ledger for a KNIGHT store."
requires-python = ">=3.12"
dependencies = ["Django>=5.0,<6.0"]

[tool.setuptools]
packages = ["knight_feature_loyalty_rewards", "knight_feature_loyalty_rewards.migrations"]
