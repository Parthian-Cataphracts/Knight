# Multi-Location, delivered as an external service (architecture: external_service).
# Generated by scaffold_external_service.py: a store forwards its events and
# proxies the merchant's screen here, so a store of any runtime can use it. The
# service runs once, at the base_url below, and proves who it is with the shared
# secret KNIGHT issues (adr/0033, adr/0034).
apiVersion: knight.dev/v1
slug: multi-location
version: 2.0.0
name: Multi-Location
description: >-
  Multi-Location run as a service rather than installed into the store: the store
  forwards its lifecycle events and proxies the merchant's screen through, so a
  store of any runtime can use it.

architecture: external_service

service:
  base_url: https://multi-location.bojanstore.com
  auth: hmac-sha256
  health: /healthz
  # The store-side secret's NAME; KNIGHT issues and delivers the value. The
  # service verifies KNIGHT's control calls with MULTI_LOCATION_CONTROL_SECRET instead,
  # set out of band on both sides.
  secret: MULTI_LOCATION_SERVICE_SECRET

webhooks:
  - event: order.placed
    path: /hooks/order-placed
    delivery: at-least-once
  - event: order.paid
    path: /hooks/order-paid
    delivery: at-least-once
  - event: order.cancelled
    path: /hooks/order-cancelled
    delivery: at-least-once
  - event: order.refunded
    path: /hooks/order-refunded
    delivery: at-least-once
  - event: order.fulfilled
    path: /hooks/order-fulfilled
    delivery: at-least-once
  - event: cart.abandoned
    path: /hooks/cart-abandoned
    delivery: at-least-once
  - event: customer.registered
    path: /hooks/customer-registered
    delivery: at-least-once
  - event: customer.updated
    path: /hooks/customer-updated
    delivery: at-least-once
  - event: product.created
    path: /hooks/product-created
    delivery: at-least-once
  - event: product.updated
    path: /hooks/product-updated
    delivery: at-least-once
  - event: product.stock_changed
    path: /hooks/product-stock-changed
    delivery: at-least-once

api_proxies:
  # The storefront reads the branch list (for a "find a branch" page or a pickup
  # picker) without a sign-in.
  - prefix: locations/
    upstream: /api/v1/public/
    methods: [GET]
    identity: anonymous
  # The merchant manages branches.
  - prefix: admin/multi-location/
    upstream: /api/v1/admin/
    methods: [GET, POST]
    identity: staff

ui_mounts:
  - slot: admin.sidebar
    label: Multi-Location
    path: /admin/multi-location
    kind: iframe

configuration:
  defaults:
    retention_days: 90
