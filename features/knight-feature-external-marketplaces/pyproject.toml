[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knight-feature-external-marketplaces"
version = "1.0.0"
description = "Connections, a queue with idempotency and retries, and reconciliation against delivery marketplaces, POS and accounting systems."
requires-python = ">=3.12"
dependencies = ["Django>=5.0,<6.0"]

[tool.setuptools]
packages = ["knight_feature_external_marketplaces", "knight_feature_external_marketplaces.migrations"]
