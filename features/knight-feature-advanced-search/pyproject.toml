[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knight-feature-advanced-search"
version = "1.0.0"
description = "Full-text search, filters and facets over a KNIGHT store's catalogue."
requires-python = ">=3.12"
dependencies = ["Django>=5.0,<6.0"]

[tool.setuptools]
packages = ["knight_feature_advanced_search", "knight_feature_advanced_search.migrations"]
