# The contract between this Feature and everything that handles it: KNIGHT
# validates it at publish, the resolver reads its dependencies, and the store's
# installer reads its install and migration declarations
# (docs/feature-delivery.md section 5).
#
# The second Feature of phase 13, and a different category from the first: an
# index rather than a set of records, a GIN index rather than a plain one, and a
# store-side call site that has to keep it fresh. What it deliberately is not is
# infrastructure - the point is to put another shape of package through the
# delivery engine, not to test a search cluster (docs/feature-catalog.md).
apiVersion: knight.dev/v1
slug: advanced-search
version: 1.0.0
name: Advanced Search
description: >-
  Full-text search over the catalogue with ranking, filters, facets and
  suggestions, on PostgreSQL's own text search. The store pushes documents into
  an index rather than this reading its tables, which is both what a Feature is
  allowed to do and what a search feature is.

django:
  app_label: knight_search
  installed_app: knight_feature_advanced_search
  urls:
    include: knight_feature_advanced_search.urls
    prefix: search/

compatibility:
  # Open at the top end: this feature touches no store internals. It is handed
  # documents and never reads a catalogue table, so a store major version can
  # change without this needing a release.
  storeVersion: ">=1.0.0"
  python: ">=3.12"
  django: ">=5.0,<6.0"

  # The fourth constraint, and a real one: the tsvector column and the ranking
  # are PostgreSQL, so a store on another engine cannot run this. It was a
  # comment until phase 14, because the schema had nowhere to say it and a key
  # nothing read would have looked like a guarantee. The resolver enforces it
  # now, so the refusal happens before an install rather than in a health check
  # afterwards.
  database: postgresql

migrations:
  required: true
  # Class A: one CreateModel, two indexes and a unique constraint. Nothing is
  # dropped and no data is transformed, so the reverse genuinely exists.
  #
  # This is also why 1.0 has no fuzzy matching. Real typo tolerance wants
  # pg_trgm, and `CREATE EXTENSION` is not Class A - it is a cluster-level
  # change that a rollback cannot safely undo, because another feature may have
  # started using the extension in the meantime. It waits for 1.1
  # (docs/adr/0016-feature-migration-and-removal-policy.md).
  reversible: true
  estimatedDurationSeconds: 10
  requiresMaintenanceWindow: false

configuration:
  defaults:
    results_per_page: 20
    # Whether a shopper's search may return things the store cannot currently
    # sell. Off, because a shop must not offer what it has no stock of.
    include_unavailable: false

install:
  strategy: package-install
  requiresRestart: true
  healthCheck: knight_feature_advanced_search.checks.health

uninstall:
  # The index is a derived copy of the store's own catalogue. Nothing is lost by
  # dropping it and a reindex rebuilds it, so there is nothing here worth
  # keeping for a year the way reviews are.
  strategy: disable-then-remove
  dataRetentionDays: 0
