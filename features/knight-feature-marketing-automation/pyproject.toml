[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knight-feature-marketing-automation"
version = "1.0.0"
description = "Triggered email campaigns for a KNIGHT store."
requires-python = ">=3.12"
dependencies = ["Django>=5.0,<6.0"]

[tool.setuptools]
packages = ["knight_feature_marketing_automation", "knight_feature_marketing_automation.migrations"]
