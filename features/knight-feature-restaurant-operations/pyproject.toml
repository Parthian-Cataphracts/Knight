[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knight-feature-restaurant-operations"
version = "1.0.0"
description = "Tables, kitchen states, preparation times, throttling and pickup scheduling for a KNIGHT store."
requires-python = ">=3.12"
dependencies = ["Django>=5.0,<6.0"]

[tool.setuptools]
packages = ["knight_feature_restaurant_operations", "knight_feature_restaurant_operations.migrations"]
