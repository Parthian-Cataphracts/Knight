# The contract between this Feature and everything that handles it: KNIGHT
# validates it at publish, the resolver reads its dependencies, and the store's
# installer reads its install and migration declarations
# (docs/feature-delivery.md section 5).
apiVersion: knight.dev/v1
slug: advanced-promotions
version: 2.0.0
name: Advanced Promotions
description: >-
  Merchandising beyond a coupon code: buy X get Y, bundles, category and
  customer-specific campaigns, scheduling and stacking rules. Plain coupons are
  part of the base store and are not sold
  (docs/adr/0024-base-store-versus-optional-feature.md).

  Owns its own tables and never extends the base store's. A Feature may not
  import store business code, so the rules here answer through services.price()
  with plain basket lines in and plain data out (docs/feature-authoring.md).

# The runtime this Feature is built for, and the block below is named for it
# (docs/adr/0032-a-feature-declares-its-runtime.md). Omitting it still means
# django - every manifest written before phase 17 is a Django Feature - but a
# contract that is stated is worth more than one that is inferred.
runtime: django

django:
  app_label: knight_promotions
  installed_app: knight_feature_promotions

compatibility:
  # 2.0.0 is the store that owns coupons itself. On a 1.x store the base
  # promotion tables do not exist, this version's rules have nothing to sit
  # beside, and the upgrade would drop the only promotions that store has.
  storeVersion: ">=2.0.0"
  python: ">=3.12"
  django: ">=5.0,<6.0"

migrations:
  required: true
  # False, and this is the field that matters most in this manifest. 2.0.0 drops
  # the promotion, coupon and redemption tables, whose rows belong to the base
  # store now. Django can recreate the tables and cannot recreate a customer's
  # campaigns, so claiming reversible here would mean a rollback that reports
  # success and has silently destroyed a year of redemption counts
  # (docs/adr/0016-feature-migration-and-removal-policy.md).
  #
  # Run `manage.py knight_absorb_promotions` on the store before upgrading.
  reversible: false
  estimatedDurationSeconds: 10
  requiresMaintenanceWindow: false

install:
  strategy: package-install
  requiresRestart: true
  healthCheck: knight_feature_promotions.checks.health

uninstall:
  # A campaign's results are a business's history, and it will ask about them
  # after the campaign is over. Kept for a year rather than the usual month.
  strategy: disable-then-remove
  dataRetentionDays: 365
