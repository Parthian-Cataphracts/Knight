# The contract between this Feature and everything that handles it: KNIGHT
# validates it at publish, the resolver reads its dependencies, and the store's
# installer reads its install and migration declarations
# (docs/feature-delivery.md section 5).
apiVersion: knight.dev/v1
slug: analytics-core
version: 1.1.0
name: Analytics Core
description: >-
  Records events for a store and rolls them into daily counters. Everything else
  analytics-related builds on this; it owns the event table.

  1.1.0 adds an optional subject to an event, and per-subject aggregation over a
  window - which is what customer-segmentation groups on.

# The runtime this Feature is built for, and the block below is named for it
# (docs/adr/0032-a-feature-declares-its-runtime.md). Omitting it still means
# django - every manifest written before phase 17 is a Django Feature - but a
# contract that is stated is worth more than one that is inferred.
runtime: django

django:
  app_label: knight_analytics_core
  installed_app: knight_feature_analytics_core

compatibility:
  # Deliberately open at the top end: this feature touches no store internals,
  # so pinning it to a store major version would create upgrade work for nothing.
  storeVersion: ">=1.0.0"
  python: ">=3.12"
  django: ">=5.0,<6.0"

migrations:
  required: true
  # 1.1.0 adds a `subject` column with a default and an index on it. Class A
  # both: nothing is dropped, nothing is transformed and no existing row is
  # rewritten - which is exactly why the subject is left empty on historical
  # events rather than backfilled. A backfill would have to invent who each
  # past event was about.
  #
  # `reversible: true` is a claim about the *schema*, and it is worth being
  # precise about what it does not claim. Reversing 0002 drops the column, so
  # every subject written while 1.1.0 was installed goes with it - the events
  # themselves survive, and the dimension does not. That is acceptable for an
  # optional field on a log and would not be for anything a customer typed,
  # which is the distinction adr/0016 draws between reversing a migration and
  # reversing a business fact.
  # Every operation is a plain CreateModel, so the reverse exists and a failed
  # upgrade can put the schema back. Declaring this honestly is what decides
  # whether a rollback is possible at all.
  reversible: true
  estimatedDurationSeconds: 5
  requiresMaintenanceWindow: false

configuration:
  defaults:
    retention_days: 90

install:
  strategy: package-install
  requiresRestart: true
  healthCheck: knight_feature_analytics_core.checks.health

uninstall:
  strategy: disable-then-remove
  dataRetentionDays: 30
