[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knight-feature-multi-location"
version = "1.0.0"
description = "Locations, opening hours, staff, per-location menus and order routing for a KNIGHT store."
requires-python = ">=3.12"
dependencies = ["Django>=5.0,<6.0"]

[tool.setuptools]
packages = ["knight_feature_multi_location", "knight_feature_multi_location.migrations"]
