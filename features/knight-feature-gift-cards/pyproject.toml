[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knight-feature-gift-cards"
version = "1.0.0"
description = "Gift cards and store credit for a KNIGHT store."
requires-python = ">=3.12"
dependencies = ["Django>=5.0,<6.0"]

[tool.setuptools]
packages = ["knight_feature_gift_cards", "knight_feature_gift_cards.migrations"]
